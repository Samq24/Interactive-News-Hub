<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NewsHub</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header class="main-header">
        <div class="logo">
            <span class="logo-gray">News</span><span class="logo-red">Hub</span>
        </div>
        <button id="menuToggle" class="menu-toggle" aria-label="Open Navigation Menu" aria-expanded="false" aria-controls="mainNavigation">☰</button>
        <nav class="nav-links" id="mainNavigation" role="navigation">
            <a href="#">Home</a>
            <a href="#">World</a>
            <a href="#">Politics</a>
            <a href="#">Business</a>
            <a href="#">Technology</a>
            <a href="#">Sports</a>
            <button class="btn btn--secondary">Subscribe</button>
        </nav>
    </header>

    <main>
        <section class="hero">
            <div class="hero-overlay"></div>
            <div class="hero-content">
                <h1>Welcome to <div class="logo"><span class="logo-gray">News</span><span class="logo-red">Hub</span></div></h1>
                <p>Your source for the latest news</p>
                <a href="#" class="btn btn--primary">Top Headlines</a>
            </div>
        </section>
        <section class="news-grid" id="breaking-news-container"></section>
        <section id="more-news-container"></section>
    </main>

    <script src="js/main.js"></script>

    <footer class="footer">
        <div class="footer-content">
            <p>&copy; 2024 NewsHub. All rights reserved.</p>
            <nav class="footer-nav">
                <a href="#">Privacy Policy</a>
                <a href="#">Terms of Service</a>
                <a href="#">Contact Us</a>
            </nav>
        </div>
    </footer>
    
</body>
</html>
